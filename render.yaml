databases:
  - name: geodraftly-db
    plan: basic-256mb
    databaseName: geodraftly
    user: geodraftly

services:
  - type: web
    name: geodraftly
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm start
    initialDeployHook: npm run db:seed
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: geodraftly-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
