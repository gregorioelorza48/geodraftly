databases:
  - name: geodraftly-db
    plan: basic-256mb
    databaseName: geodraftly
    user: geodraftly

services:
  - type: web
    name: geodraftly
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node scripts/hosted-start.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: DATABASE_URL
        fromDatabase:
          name: geodraftly-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
